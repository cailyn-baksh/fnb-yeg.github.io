<!DOCTYPE html>
<html lang="en">
  <head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>

	<link href="/stylesheet.css" rel="stylesheet" type="text/css"/>

    <script src="/js/sitedata.js"></script>
	<script src="/js/markdown.min.js"></script>
    <script src="/js/utils.js"></script>

    <!-- Data sources -->
    <link data-include="content" rel="preload" as="fetch"
        title="navbar" type="text/html" href="/fragments/navbar.html" />
    <link data-include="content" rel="preload" as="fetch"
        title="footer" type="text/html" href="/fragments/footer.html" />

    <link data-include="data" rel="preload" as="fetch"
        href="/data/recipes.json" />

	<title>Recipes — Food Not Bombs Edmonton</title>

    <script>
        document.addEventListener("sitedata-finish", () => {
            // Get recipe data
            const recipes = SiteData.query("recipes");
            let recipeGroups = { "DEFAULT": {} };

            try {
                // Insert default group at start
                recipeGroups = Object.assign(recipeGroups, SiteData.query("recipe_groups"));
            } catch (e) {
                // Recipe groups are not defined
                if (!(e instanceof ReferenceError)) throw e;
            }

            // Select template elements
            const recipeListTemplate = document.getElementById("recipeListTemplate");
            const recipeListItemTemplate = document.getElementById("recipeListItemTemplate");

            // Get recipe list item
            const recipeList = document.getElementById("recipe-list");

            // Get recipe name from URL query
            const queried = new URLSearchParams(window.location.search).get("recipe");

            if (!(queried in recipes)) {
                // No recipe or invalid name; list all recipes

                // Create nodes for each recipe group
                for (const [groupID, group] of Object.entries(recipeGroups)) {
                    const container = document.createElement("div");
                    container.id = groupID;

                    // Insert lead if provided
                    if ("lead" in group) {
                        const lead = document.createElement("p");
                        lead.classList.add("lead");
                        lead.innerHTML = group.lead;
                        container.appendChild(lead);
                    }

                    // Create subgroups
                    if (!("subgroups" in group)) {
                        // All one group
                        group["subgroups"] = { "DEFAULT": "" };
                    }

                    for (const subgroup in group.subgroups) {
                        const groupElem = document.importNode(recipeListTemplate.content, true);

                        groupElem.querySelector(".subgroupName").innerHTML =
                            group.subgroups[subgroup];

                        groupElem.querySelector(".recipeList").id = subgroup;

                        container.appendChild(groupElem);
                    }

                    recipeList.appendChild(container);
                }

                // Populate recipes
                for (const [recipeName, recipeData] of Object.entries(recipes)) {
                    // Get container
                    const groupName = recipeData.group ?? "DEFAULT";
                    const subgroupName = recipeData.subgroup ?? "DEFAULT";
                    const list = document.querySelector(`#${groupName} #${subgroupName}`);

                    const itemElem = document.importNode(recipeListItemTemplate.content, true);
                    const itemName = itemElem.querySelector(".recipe-name");
                    const itemLink = itemElem.querySelector(".recipe-link");

                    itemName.innerHTML = recipeName;
                    itemLink.href = `/recipes_new?recipe=${recipeName}`;

                    list.appendChild(itemElem);
                }
            } else {
                // Load selected recipe
                console.log("Query", queried);
            }
        });
    </script>
</head>

<body>
	<div class="content gradient">
        <nav data-driven="innerHTML=@navbar"></nav>
		<div class="container">
            <div class="card">
                <div class="card-body">
                    <div id="recipe-list" class="content">
                        <h2>Recipes</h2>
                        <!-- use <template> ? -->
                    </div>

                    <template id="recipeListTemplate">
                        <p><span class="subgroupName"></span><small>
                            <ul class="recipeList"></ul>
                        </small></p>
                    </template>

                    <template id="recipeListItemTemplate">
                        <li>
                            <div class="row">
								<div class="recipe-name col-xs-12 col-md-4 col-xl-3"></div>
								<div class="col-xs-12 col-md-2"><a class="recipe-link">[full recipe]</a></div>
                            </div>
                        </li>
                    </template>
                </div>
            </div>
		</div>
	</div>
    <footer data-driven="innerHTML=@footer"></footer>
</body>
</html>
