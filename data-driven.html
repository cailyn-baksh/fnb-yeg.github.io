<!doctype html>
<html lang="en">
  <head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>

	<link href="/stylesheet.css" rel="stylesheet" type="text/css"/>

    <!-- Load additional data source using link prefetch -->

    <!-- Load data from a JSON file -->
    <link data-include="data" rel="preload" as="fetch" href="/data/source1.json" />

    <!-- Load HTML content -->
    <link data-include="content" rel="preload" as="fetch"
        title="fragment" type="text/html" href="/data/fragment.html" />

    <!-- Load binary content -->
    <link data-include="content" rel="preload" as="fetch"
        title="image" type="image/png" href="/data/image.png" />
    <link data-include="content" rel="preload" as="fetch"
        title="image2" type="image/png" href="/data/image2.png" />

    <!--<script src="/js/markdown.min.js"></script>-->
	<script src="/js/sitedata.js"></script>

	<title>Data driven test</title>
</head>
<body>
    <p data-driven="innerHTML=msg">foo</p>
    <p data-driven="innerHTML=obj.msg;style=obj.style">bar</p>

    <div style="border: 1px solid black" data-driven="innerHTML=@fragment"></div>

    <img data-driven="src=@image" alt="Image loaded from data-driven content" />

    <p><a data-driven="href=override-url;innerText=override-msg"></a></p>
</body>
</html>
