<!doctype html>
<html lang="en">
  <head>
<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" crossorigin="anonymous"></script>

    <!-- https://github.com/Vincenius/bsky-embed -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bsky-embed/dist/bsky-embed.es.js" async></script>

	<link href="/stylesheet.css" rel="stylesheet" type="text/css"/>

    <script src="/js/sitedata.js"></script>
	<script src="/js/markdown.min.js"></script>
    <script src="/js/utils.js"></script>

    <!-- Data sources -->
    <link data-include="content" rel="preload" as="fetch"
        title="navbar" type="text/html" href="/fragments/navbar.html" />
    <link data-include="content" rel="preload" as="fetch"
        title="footer" type="text/html" href="/fragments/footer.html" />

    <link data-include="data" rel="preload" as="fetch"
        href="/data/announcements.json" />
    <link data-include="content" rel="preload" as="fetch"
        title="newsCard" type="text/html" href="/fragments/announcement.html" />

	<title>News — Food Not Bombs Edmonton</title>

	<!-- Style for newsletter desc -->
    <style>
        #newsletterCollapseText {
            background-color: #fff;
        }

        #newsletterCollapseText header {
            border-radius: 3px;
            padding: 10px;

            color: #fff;
            text-shadow: 1px 1px 5px #444;
            background-image: linear-gradient(90deg, #01be65, #01be65 80%, #fff);
        }
	</style>

    <!-- Newsletter loading -->
    <script>
        document.addEventListener("sitedata-finish", () => {
            const sd = new SiteData();

            // Get list of news items, ordered by date
            let announcements = SiteData.query("announcements");
            announcements.sort((a,b) => {
                if (!("date" in a)) return 1;  // No date; move to back

                if (a.date > b.date) {
                    return -1;  // a is more recent
                } else if (a.date < b.date) {
                    return 1;  // b is more recent
                } else {
                    return 0;
                }
            });

            // Create card for each announcement
            const MAX_CARDS = 10;
            const container = document.getElementById("announcements");
            for (let i=0; i < announcements.length && i < MAX_CARDS; ++i) {
                const announcement = announcements[i];

                // Create card
                const carouselID = `annoucementCarousel${i}`;
                let cardHTML = SiteData.query("@newsCard")
                    .replaceAll("carouselID", carouselID);

                container.innerHTML += cardHTML;
                const card = container.lastElementChild;

                // Add images
                const imgContainer = card.querySelector(".imgContainer");

                // Returns [src, alt]
                const getImageData = (img) => {
                    switch (typeof img) {
                        case "string":
                            return [img, ""];
                        case "object":
                            return [img.src, img.alt];
                        default:
                            return ["", ""];
                    }
                };

                if ("images" in announcement) {
                    if (announcement.images.length === 1) {
                        // Add one image
                        const img = document.createElement("img");
                        [img.src, img.alt] = getImageData(announcement.images[0]);
                        img.classList.add("card-img-top");
                        imgContainer.appendChild(img);
                    } else if (announcement.images.length > 1) {
                        // Add multiple images in a carousel
                        let images = [];
                        for (const image of announcement.images) {
                            let elem = document.createElement("img");
                            [elem.src, elem.alt] = getImageData(image);
                            elem.classList.add("d-block", "w-100");
                            images.push(elem);
                        }
                        makeBSCarousel(imgContainer, images);
                    }
                }

                // Populate news data
                if ("title" in announcement) {
                    card.querySelector(".announcement-title")
                        .innerHTML = announcement.title;
                }
                if ("description" in announcement) {
                    card.querySelector(".announcement-desc")
                        .innerHTML = announcement.description;
                }

                // Add transcription if present
                if ("transcription" in announcement) {
                    let transID = randomID("transcription");

                    // Generate collapse toggle
                    let p = document.createElement("p");
                    let elem = document.createElement("a");
                    elem.dataset.bsToggle = "collapse";
                    elem.href = `#${transID}`;
                    elem.role = "button";
                    elem.ariaExpanded = false;
                    elem.ariaControls = transID;
                    elem.innerText = "[View Image Transcription]";
                    p.appendChild(elem);
                    card.querySelector(".card-body").appendChild(p);

                    // Generate transcription element
                    let trans = document.createElement("div");
                    trans.classList.add("collapse");
                    trans.id = transID;
                    trans.innerHTML = announcement.transcription;
                    card.querySelector(".card-body").appendChild(trans);
                }

                // Populate date if a valid date is provided
                let date = new Date(announcement.date + "T00:00-06:00");
                if (!isNaN(date.valueOf())) {
                    card.querySelector(".announcement-date")
                        .innerText = date.toDateString();
                }
            }

            SiteData.populateDocument(container);
            renderMarkdown(container);
        });
    </script>
</head>

<body>
	<div class="content gradient">
        <nav data-driven="innerHTML=@navbar"></nav>
		<div class="container">
            <div class="row justify-content-center">
                <!-- Social feeds -->
                <div class="col-xs-12 col-lg-8">
                    <div class="card vh-100 overflow-scroll">
                        <ul class="nav nav-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="bsky-tab"
                                    data-bs-toggle="tab"
                                    data-bs-target="#bsky-tab-pane"
                                    type="button" role="tab"
                                    aria-controls="bsky-tab-pane"
                                    aria-selected="true">
                                    <i class="ri-bluesky-fill"></i>Bluesky
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="insta-tab"
                                    data-bs-toggle="tab"
                                    data-bs-target="#insta-tab-pane"
                                    type="button" role="tab"
                                    aria-controls="insta-tab-pane"
                                    aria-selected="true">
                                    <i class="ri-instagram-line"></i>Instagram
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content h-100" id="socialTabs">
                            <div class="tab-pane show active" id="bsky-tab-pane"
                                role="tabpanel" aria-labelledby="bsky-tab" tabindex=0>
                                <bsky-embed username="foodnotbombsyeg.bsky.social"
                                    load-more="true"></bsky-embed>
                            </div>
                            <div class="tab-pane h-100" id="insta-tab-pane"
                                role="tabpanel" aria-labelledby="insta-tab" tabindex=0>
                                <iframe class="h-100 w-100" loading="lazy"
                                    src="https://www.instagram.com/foodnotbombs_yeg/embed/" frameborder="0"></iframe>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Newsletters & Announcements -->
            <hr />

            <!-- Data-driven -->
            <div class="row justify-content-center" id="announcements"></div>

			<div class="row my-5">
				<div class="text-end">
					<a class="btn btn-light" href="/olds.html">Archived News<i class="ri-arrow-right-s-line"></i></a>
				</div>
			</div>
		</div>
	</div>
    <footer data-driven="innerHTML=@footer"></footer>
</body>
</html>
